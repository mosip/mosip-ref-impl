# Local profile for pre-registration-booking-service (run-local.sh / run-local.bat).
# Activate with: -Dspring.profiles.active=local
# Cluster Docker does not set this profile; it uses bootstrap + config-server env.
# No config-server, authmanager, or PostgreSQL required. H2 is in-memory.

server.port=9095
server.servlet.context-path=/preregistration/v1
application.env.local=true

spring.http.converters.preferred-json-mapper=jackson2

# Boot 4 local run (no config-server)
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
health.config.enabled=false
management.health.config.enabled=false
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh
spring.info.git.location=classpath:service-git.properties

# Auth adapter (offline; do not point issuer at localhost or a Eureka service name)
mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
auth.server.admin.offline.token.validate=true
auth.server.validate.url=http://127.0.0.1:8091/authmanager/authorize/validateToken
auth.role.prefix=ROLE_
auth.header.name=Authorization
spring.security.method-security.enabled=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
mosip.global.end-points=/**
mosip.service.end-points=/**
mosip.kernel.auth.appids.realm.map={prereg:'preregistration'}
mosip.iam.adapter.clientid=mosip-prereg-client
mosip.iam.adapter.clientsecret=local
mosip.iam.adapter.appid=prereg
prereg.auth.jwt.secret=Yn2kjibddFAWtnPJ2AFlL8WXmohJMCvigQggaEypa5E=
mosip.security.authentication.provider.beans.list.pre-registration-booking-service=customJWTAuthProvider

# H2: entities live in schema prereg. INIT creates it before Hibernate ddl-auto.
spring.datasource.url=jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS prereg
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false
javax.persistence.jdbc.driver=org.h2.Driver
javax.persistence.jdbc.url=jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS prereg
javax.persistence.jdbc.user=sa
javax.persistence.jdbc.password=
hibernate.hbm2ddl.auto=update

