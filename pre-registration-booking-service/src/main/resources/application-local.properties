# Local profile. Activate with: -Dspring.profiles.active=local
# Cluster gets auth adapter + JDBC from mosip-config; bootstrap leaves the adapter
# package commented on purpose.
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
application.env.local=true

spring.datasource.url=jdbc:h2:mem:prereg;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS PREREG
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
javax.persistence.jdbc.url=${spring.datasource.url}
javax.persistence.jdbc.user=sa
javax.persistence.jdbc.password=
javax.persistence.jdbc.driver=org.h2.Driver
hibernate.hbm2ddl.auto=update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

regCenter.url=http://localhost:8086/masterdata/v1.0/registrationcenters
holiday.url=http://localhost:8086/masterdata/v1.0/getregistrationcenterholidays/
demographic.resource.url=http://localhost:9092/pre-registration/v1.0/applications
notification.url=http://localhost:8083/notification/notify
booking.resource.url=http://localhost:9095/preregistration/v1
cryptoResource.url=http://localhost:8087/cryptomanager/v1.0
audit.url=http://localhost:8088/auditmanager/v1.0/audits
emailResourse.url=http://localhost:8089/emailnotifier/v1.0/email/send
smsResourse.url=http://localhost:8090/smsnotifier/v1.0/sms/send
resource.template.url=http://localhost:8086/masterdata/v1.0/templates
mosip.kernel.idobjectvalidator.masterdata.documenttypes.rest.uri=http://localhost:8086/v1/masterdata/documenttypes/{documentcategorycode}/{langcode}
mosip.kernel.masterdata.validdoc.rest.uri=http://localhost:8086/masterdata/validdocuments/

preregistration.availability.sync=7
preregistration.availability.noOfDays=7
preregistration.booking.offset=2
preregistration.timespan.cancel=24
preregistration.timespan.rebook=24
mosip.utc-datetime-pattern=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
mosip.notification.timezone=GMT+05:30
version=1.0
mosip.mandatory-languages=eng
mosip.optional-languages=fra
preregistration.crypto.applicationId=PRE_REGISTRATION
preregistration.crypto.referenceId=INDIVIDUAL
preregistration.crypto.PrependThumbprint=false
email.acknowledgement.template=Email-Acknowledgement
email.acknowledgement.subject.template=Acknowledgement-email-subject
cancel.appointment.email.subject=cancel-appointment-email-subject
sms.acknowledgement.template=SMS-Acknowledgement
cancel.appoinment.template=cancel-appointment

mosip.preregistration.booking.availability.sync.id=mosip.preregistration.booking.availability.sync
mosip.preregistration.booking.id.book=mosip.pre-registration.booking.book
mosip.preregistration.booking.fetch.booking.id=mosip.preregistration.booking.fetch.booking
mosip.preregistration.booking.cancel.id=mosip.preregistration.booking.cancel
mosip.preregistration.booking.delete.id=mosip.preregistration.booking.delete
mosip.preregistration.booking.fetch.availability.id=mosip.preregistration.booking.fetch.availability
mosip.preregistration.booking.fetchPreidByDate.id=mosip.preregistration.booking.fetchPreidByDate
mosip.preregistration.booking.availability.increase.id=mosip.preregistration.booking.availability.increase
mosip.preregistration.booking.availability.check.id=mosip.preregistration.booking.availability.check
mosip.preregistration.booking.delete.old.id=mosip.preregistration.booking.delete.old
mosip.preregistration.booking.exception.id=mosip.preregistration.booking.parse.exception

mosip.role.prereg.getappointmentavailability=INDIVIDUAL
mosip.role.prereg.postappointmentpreregistrationid=INDIVIDUAL
mosip.role.prereg.postappointment=INDIVIDUAL
mosip.role.prereg.getappointmentpreregistrationid=INDIVIDUAL
mosip.role.prereg.putappointmentpreregistrationid=INDIVIDUAL
mosip.role.prereg.putbatchappointmentpreregistrationid=INDIVIDUAL
mosip.role.prereg.deleteappointment=INDIVIDUAL
mosip.role.prereg.getappointmentpreregistrationidregistrationcenterid=INDIVIDUAL
mosip.role.prereg.getappointmentregistrationcenterid=INDIVIDUAL

mosip.kernel.auth.appids.realm.map={prereg:'preregistration',ida:'mosip',registrationclient:'mosip',regproc:'mosip',partner:'mosip',resident:'mosip',admin:'mosip'}
mosip.iam.adapter.clientid=mosip-prereg-client
mosip.iam.adapter.clientsecret=local
mosip.iam.adapter.appid=prereg
auth.server.admin.issuer.uri=http://localhost:8080/auth/realms/
auth-token-generator.rest.issuerUrl=http://localhost:8080
mosip.security.authentication.provider.beans.list=customJWTAuthProvider
