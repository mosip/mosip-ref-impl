# Local profile for registration-processor-external-stage (run-local.sh / run-local.bat).
# Activate with: -Dspring.profiles.active=local
# Cluster Docker does not set this profile; it uses bootstrap + config-server env.
# Vert.x stage still needs Kafka / status DB / EIS for packet processing.
# init and test work without that stack. start/smoke only prove the JVM comes up
# if MOSIP registration-processor SNAPSHOTs can bind with these stubs.

server.port=8095
eventbus.port=5736
server.servlet.path=/registrationprocessor/v1/external
worker.pool.size=10
mosip.regproc.external.message.expiry-time-limit=1500
spring.application.name=registration-processor
# MosipVerticleAPIManager @Value — unresolved leaves the literal ${...} which is not a Boolean
registration.processor.signature.isEnabled=false
mosip.registration.processor.digital.signature.id=mosip.digital.signature
mosip.registration.processor.datetime.pattern=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
mosip.registration.processor.application.version=1.0
mosip.utc-datetime-pattern=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
# RegistrationExternalStatusUtility / RegistrationStatusServiceImpl (ints and SpEL lists)
registration.processor.max.retry=5
registration.processor.reprocess.elapse.time=21600
registration.processor.main-processes=NEW,UPDATE,LOST,RES_UPDATE,ACTIVATE,DEACTIVATE
registration.processor.sub-processes=BIOMETRIC_CORRECTION
mosip.regproc.registration.status.service.disable-audit=true

spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
health.config.enabled=false
management.endpoints.web.exposure.include=info,health,refresh
spring.info.git.location=classpath:service-git.properties

mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
auth.server.admin.offline.token.validate=true
spring.security.method-security.enabled=false
mosip.global.end-points=/**
mosip.service.end-points=/**
# TokenHelper: @Value("#{${mosip.kernel.auth.appids.realm.map}}") — must be a SpEL map, not empty
mosip.kernel.auth.appids.realm.map={prereg:'preregistration',ida:'mosip',registrationclient:'mosip',regproc:'mosip',partner:'mosip',resident:'mosip',admin:'mosip',crereq:'mosip',creser:'mosip',datsha:'mosip'}
mosip.iam.adapter.clientid=mosip-regproc-client
mosip.iam.adapter.clientsecret=local
mosip.iam.adapter.appid=regproc
token.request.id=io.mosip.registration.processor
token.request.appid=regproc
token.request.version=1.0
token.request.clientId=mosip-regproc-client
token.request.secretKey=local
token.request.issuerUrl=http://127.0.0.1:8080/auth/realms/mosip

# UrlXmlConfig needs an absolute URI; applyLocalProfile overwrites this with file: .local/hazelcast-local.xml
vertx.cluster.configuration=localhost
registration.processor.zone=secure
mosip.regproc.eventbus.type=vertx
mosip.regproc.external.eventbus.port=5736
mosip.regproc.external.server.port=8095

# HibernateDaoConfig (kernel-dataaccess-hibernate) reads these keys, not spring.datasource.*
javax.persistence.jdbc.driver=org.h2.Driver
javax.persistence.jdbc.url=jdbc:h2:mem:regproc;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS regprc
javax.persistence.jdbc.user=sa
javax.persistence.jdbc.password=
javax.persistence.jdbc.schema=regprc
hibernate.hbm2ddl.auto=update
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.jdbc.lob.non_contextual_creation=true

mosip.regproc.external.eventbus.kafka.commit.type=single
mosip.regproc.external.eventbus.kafka.max.poll.records=100
mosip.regproc.external.eventbus.kafka.poll.frequency=100
mosip.regproc.external.eventbus.kafka.group.id=external-stage
mosip.regproc.eventbus.kafka.commit.type=${mosip.regproc.external.eventbus.kafka.commit.type}
mosip.regproc.eventbus.kafka.max.poll.records=${mosip.regproc.external.eventbus.kafka.max.poll.records}
mosip.regproc.eventbus.kafka.poll.frequency=${mosip.regproc.external.eventbus.kafka.poll.frequency}
mosip.regproc.eventbus.kafka.group.id=${mosip.regproc.external.eventbus.kafka.group.id}

# EIS stub (start EIS with its own run-local first if you exercise the HTTP hop)
eisservice=http://127.0.0.1:8201/registrationprocessor/v1/eis/registration-processor/external-integration-service/v1.0
