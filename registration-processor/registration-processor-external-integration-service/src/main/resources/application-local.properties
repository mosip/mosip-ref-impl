# Local profile for registration-processor-external-integration-service (run-local.sh / run-local.bat).
# Activate with: -Dspring.profiles.active=local
# Cluster Docker does not set this profile; it uses bootstrap + config-server env.
# No config-server required. Stub POST always returns true when the body is non-null.

server.port=8201
server.servlet.path=/registrationprocessor/v1/eis
spring.mvc.servlet.path=${server.servlet.path}

spring.http.converters.preferred-json-mapper=jackson2

spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
health.config.enabled=false
management.health.config.enabled=false
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh
spring.info.git.location=classpath:service-git.properties

mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
auth.server.admin.offline.token.validate=true
spring.security.method-security.enabled=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
mosip.global.end-points=/**
mosip.service.end-points=/**

openapi.info.title=External Integration Service
openapi.info.description=External Integration Service
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
openapi.service.servers[0].url=${server.servlet.path}
openapi.service.servers[0].description=External Integration Service
openapi.group.name=${openapi.info.title}
openapi.group.paths[0]=/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.syntaxHighlight.activated=false
springdoc.swagger-ui.validator-url=none
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
